name: release

# On a version tag (or manual dispatch), build the .mass package on each
# target OS and attach all of them to a single GitHub Release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write  # upload release artifacts

env:
  GOPRIVATE: github.com/chinese-room-solutions/*

jobs:
  # The manifest's version is what an installed gateway reports to MASS — the
  # key a worker's compatible range is matched against. It is not derived from
  # the tag (no -X ldflag; the binary reads runtime.yml), so nothing but this
  # check stops a release shipping yesterday's version. v0.2.0 did exactly
  # that: tagged 0.2.0, manifest still 0.1.0, and every worker lookup for the
  # pair 404'd. Fails fast, before three builds.
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Manifest version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(sed -n 's/^version:[[:space:]]*//p' manifest/runtime.yml | head -1 | tr -d '"'"'"' ')"
          if [ "$tag" != "$manifest" ]; then
            echo "::error file=manifest/runtime.yml::manifest version '$manifest' != tag '$tag'; bump manifest/runtime.yml before tagging"
            exit 1
          fi
          echo "manifest version $manifest matches tag $GITHUB_REF_NAME"

  package:
    needs: manifest
    name: package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `asset` is the release-asset basename: <name>_<goos>_<goarch>, no
        # version — stable names keep releases/latest/download/ links evergreen.
        include:
          - os: ubuntu-latest
            label: linux-amd64
            asset: mass-runtime-gateway-llama-cpp_linux_amd64
          - os: windows-latest
            label: windows-amd64
            asset: mass-runtime-gateway-llama-cpp_windows_amd64
          - os: macos-15
            label: macos-arm64
            asset: mass-runtime-gateway-llama-cpp_darwin_arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Configure private module access
        shell: bash
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - name: Test
        run: make test
      - name: Package
        run: make package
      - name: Rename for platform
        shell: bash
        run: |
          mv dist/mass-runtime-gateway-llama-cpp.mass dist/${{ matrix.asset }}.mass
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/*.mass

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*.mass
          generate_release_notes: true
